services:
  - type: web
    name: smart-vcard
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://smart-vcard.onrender.com
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: AUTORUN_ENABLED
        value: "false"
      - key: PHP_OPCACHE_ENABLE
        value: "1"
    disk:
      name: sqlite-data
      mountPath: /var/www/html/database
      sizeGB: 1
    healthCheckPath: /up
