app = "smart-vcard"
primary_region = "lhr"

[build]

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  LOG_STDERR_FORMATTER = "json"
  SESSION_DRIVER = "cookie"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "sync"
  FILESYSTEM_DISK = "public"
  DB_CONNECTION = "sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "storage"
  destination = "/var/www/html/storage/app"

[deploy]
  release_command = "php artisan migrate --force"
